apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: evaluate
  labels:
    app.kubernetes.io/name: abevalflow
    app.kubernetes.io/component: konflux
spec:
  description: >-
    Generic evaluation task for Konflux integration. Dispatches to the
    appropriate evaluation engine (a2a, harbor, ase, mcpchecker) and supports
    two execution modes: "local" runs evaluation directly in the task step,
    "remote" submits an evaluation Pod to a workload cluster. Consumers
    provide the target endpoint (AGENT_ENDPOINT / MCP_URL) as a parameter;
    this task does not deploy or manage any target services.
  params:
    - name: eval-engine
      type: string
      description: "Evaluation engine: harbor, ase, mcpchecker, a2a"
    - name: submission-dir
      type: string
      description: Submission directory name under submissions/
    - name: submission-name
      type: string
      description: Validated submission name from prepare task
    - name: commit-sha
      type: string
      default: ""
    - name: pipeline-run-id
      type: string
    - name: pipeline-repo-url
      type: string
      default: "https://github.com/RHEcosystemAppEng/ABEvalFlow.git"
    - name: pipeline-repo-revision
      type: string
      default: "main"
    - name: eval-base-image
      type: string
      default: "quay.io/rh-ee-ikrispin/abevalflow-eval-base:latest"
      description: Container image with Harbor + dependencies pre-installed
    - name: llm-model
      type: string
      default: "claude-sonnet"
    - name: llm-api-base
      type: string
      default: ""
      description: LLM proxy base URL for judging (e.g. http://litellm.ns.svc:4000)
    - name: llm-api-key
      type: string
      default: "sk-dummy"
    - name: agent-endpoint
      type: string
      default: ""
      description: "HTTP endpoint of the A2A agent (required when eval-engine=a2a)"
    - name: agent-timeout
      type: string
      default: "120"
      description: A2A agent request timeout in seconds
    - name: mcp-url
      type: string
      default: ""
      description: "URL of the MCP server (required when eval-engine=mcpchecker)"
    - name: mcpchecker-agent-model
      type: string
      default: "google:gemini-2.5-flash"
    - name: mcpchecker-judge-model
      type: string
      default: "openai:gpt-4o"
    - name: mcpchecker-task-timeout
      type: string
      default: "10m"
    - name: ase-iterations
      type: string
      default: "5"
    - name: ase-concurrency
      type: string
      default: "1"
    - name: ase-judge-model
      type: string
      default: ""
    - name: uplift-threshold
      type: string
      default: "0.0"
    - name: eval-mode
      type: string
      default: "local"
      description: >-
        "local" runs eval directly in the task step (target must be reachable
        from the pipeline cluster). "remote" submits an eval Pod to the
        workload cluster (for cross-cluster scenarios).
    - name: workload-cluster-url
      type: string
      default: ""
      description: API URL of the workload cluster (required when eval-mode=remote)
    - name: workload-namespace
      type: string
      default: ""
      description: Namespace on the workload cluster (required when eval-mode=remote)
    - name: workload-credentials-secret
      type: string
      default: "workload-cluster-credentials"
      description: >-
        Name of the Secret containing 'token' key for the workload cluster.
        Only used when eval-mode=remote.
    - name: eval-timeout
      type: string
      default: "1800"
      description: Timeout in seconds for remote eval Pod
  workspaces:
    - name: source
  results:
    - name: treatment-mean-reward
      description: Treatment/with-skill mean reward
    - name: control-mean-reward
      description: Control/without-skill mean reward
    - name: recommendation
      description: Pass or fail recommendation
    - name: results-dir
      description: Path to evaluation results
  steps:
    - name: run-eval
      image: registry.access.redhat.com/ubi9/python-311:9.6
      env:
        - name: WORKLOAD_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.workload-credentials-secret)
              key: token
              optional: true
        - name: OPENAI_API_KEY
          value: "$(params.llm-api-key)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== EVALUATE PHASE ==="

        EVAL_ENGINE="$(params.eval-engine)"
        EVAL_MODE="$(params.eval-mode)"
        SUBMISSION_NAME="$(params.submission-name)"
        SUBMISSION_DIR="$(params.submission-dir)"
        AGENT_ENDPOINT="$(params.agent-endpoint)"
        MCP_URL="$(params.mcp-url)"
        COMMIT_SHA="$(params.commit-sha)"
        PIPELINE_RUN_ID="$(params.pipeline-run-id)"
        UPLIFT_THRESHOLD="$(params.uplift-threshold)"

        echo "Engine: $EVAL_ENGINE"
        echo "Mode: $EVAL_MODE"
        echo "Submission: $SUBMISSION_NAME"

        RESULTS_DIR="$(workspaces.source.path)/eval-results/$SUBMISSION_NAME"
        REPORT_DIR="$(workspaces.source.path)/reports/$SUBMISSION_NAME"
        mkdir -p "$RESULTS_DIR" "$REPORT_DIR"

        echo -n "0.0" > "$(results.treatment-mean-reward.path)"
        echo -n "0.0" > "$(results.control-mean-reward.path)"
        echo -n "fail" > "$(results.recommendation.path)"
        echo -n "$RESULTS_DIR" > "$(results.results-dir.path)"

        # ---- Clone pipeline repo ----
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        if [ -d "$PIPELINE_DIR/.git" ]; then
          git -C "$PIPELINE_DIR" fetch origin "$(params.pipeline-repo-revision)" --depth 1 2>/dev/null || true
          git -C "$PIPELINE_DIR" -c advice.detachedHead=false checkout FETCH_HEAD 2>/dev/null || true
        else
          git clone --depth 1 --branch "$(params.pipeline-repo-revision)" \
            "$(params.pipeline-repo-url)" "$PIPELINE_DIR"
        fi

        # ================================================================
        # REMOTE MODE: submit an eval Pod to the workload cluster
        # ================================================================
        if [ "$EVAL_MODE" = "remote" ]; then
          echo "=== Remote eval mode ==="

          if [ -z "${WORKLOAD_TOKEN:-}" ]; then
            echo "ERROR: workload-credentials-secret has no token for remote mode"
            exit 1
          fi

          CLUSTER_URL="$(params.workload-cluster-url)"
          NAMESPACE="$(params.workload-namespace)"
          if [ -z "$CLUSTER_URL" ] || [ -z "$NAMESPACE" ]; then
            echo "ERROR: workload-cluster-url and workload-namespace required for remote mode"
            exit 1
          fi

          pip install --quiet --no-cache-dir openshift-client 2>/dev/null || true
          microdnf install -y openshift-clients --nodocs 2>/dev/null || true

          # TODO: Replace --insecure-skip-tls-verify with --certificate-authority
          oc login --server="$CLUSTER_URL" --token="$WORKLOAD_TOKEN" --insecure-skip-tls-verify=true 2>/dev/null

          RUN_ID=$(echo "$PIPELINE_RUN_ID" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-20)
          POD_NAME="eval-job-${RUN_ID:-$(date +%s)}"
          echo "Eval pod: $POD_NAME"

          cat <<PODSPEC | oc apply -n $NAMESPACE -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: $POD_NAME
            namespace: $NAMESPACE
            labels:
              abevalflow/temp: "true"
              abevalflow/type: eval-job
          spec:
            restartPolicy: Never
            activeDeadlineSeconds: $(params.eval-timeout)
            containers:
            - name: eval
              image: $(params.eval-base-image)
              command: ["/bin/bash", "-c"]
              args:
              - |
                set -euo pipefail
                export HOME=/tmp

                echo "=== Remote Eval Pod Starting ==="
                echo "Engine: $EVAL_ENGINE"

                git clone --depth 1 --branch "$(params.pipeline-repo-revision)" \
                  "$(params.pipeline-repo-url)" /tmp/abevalflow
                cd /tmp/abevalflow
                export PYTHONPATH=/tmp/abevalflow
                pip install --quiet --no-cache-dir pydantic scipy pyyaml 2>&1 | tail -1

                SUBMISSION_PATH="/tmp/abevalflow/submissions/$SUBMISSION_DIR"
                RESULTS_DIR="/tmp/eval-results"
                REPORT_DIR="/tmp/eval-reports"
                mkdir -p "\$RESULTS_DIR" "\$REPORT_DIR"

                if [ "$EVAL_ENGINE" = "a2a" ]; then
                  N_ATTEMPTS=\$(python3 -c "
                import yaml
                try:
                    meta = yaml.safe_load(open('\$SUBMISSION_PATH/metadata.yaml'))
                    print(meta.get('experiment', {}).get('n_trials', 5))
                except:
                    print(5)
                ")

                  TASK_DIR=""
                  if [ -f "\$SUBMISSION_PATH/task.toml" ]; then
                    TASK_DIR="\$SUBMISSION_PATH"
                  elif [ -d "\$SUBMISSION_PATH/tasks" ]; then
                    for subdir in "\$SUBMISSION_PATH/tasks"/*/; do
                      if [ -f "\${subdir}task.toml" ]; then
                        TASK_DIR="\${subdir%/}"
                        break
                      fi
                    done
                  fi

                  if [ -z "\$TASK_DIR" ]; then
                    echo "ERROR: No task.toml found"
                    exit 1
                  fi

                  echo "Task: \$(basename \$TASK_DIR) | Attempts: \$N_ATTEMPTS"

                  python3 - "\$RESULTS_DIR" "\$TASK_DIR" "\$N_ATTEMPTS" "$AGENT_ENDPOINT" "$(params.agent-timeout)" "$(params.llm-api-base)" "openai/$(params.llm-model)" <<'GENCFG'
                import sys, yaml
                results_dir, task_dir, n_attempts, endpoint, timeout, llm_api_base, llm_model = sys.argv[1:8]
                config = {
                    "job_name": "a2a-eval",
                    "jobs_dir": results_dir,
                    "n_attempts": int(n_attempts),
                    "agents": [{"import_path": "abevalflow.harbor_agents.a2a_adapter:A2AAgent", "kwargs": {"endpoint": endpoint, "timeout": int(timeout)}}],
                    "tasks": [{"path": task_dir}],
                    "environment": {"type": "local"},
                    "verifier": {"env": {"LLM_JUDGE_MODEL": llm_model, "LLM_API_BASE": llm_api_base, "OPENAI_API_KEY": "sk-dummy"}}
                }
                with open(results_dir + "/config.yaml", "w") as f:
                    yaml.dump(config, f, default_flow_style=False)
                GENCFG

                  python3 -c "from abevalflow.harbor_agents.a2a_adapter import A2AAgent; print('A2AAgent imported OK')"
                  HARBOR_EXIT=0
                  harbor run -c "\$RESULTS_DIR/config.yaml" -y 2>&1 || HARBOR_EXIT=\$?
                  echo "Harbor exit code: \$HARBOR_EXIT"
                  find "\$RESULTS_DIR" -name "exception.txt" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || true

                elif [ "$EVAL_ENGINE" = "mcpchecker" ]; then
                  echo "=== MCPChecker Evaluation ==="
                  pip install --quiet --no-cache-dir mcpchecker 2>&1 | tail -1
                  cd "\$SUBMISSION_PATH"
                  export MCP_URL="$MCP_URL"
                  envsubst < mcp-config.yaml > mcp-config-resolved.yaml 2>/dev/null || cp mcp-config.yaml mcp-config-resolved.yaml
                  mcpchecker check eval.yaml --mcp-config-file mcp-config-resolved.yaml -o json > "\$RESULTS_DIR/mcpchecker-out.json" 2>&1 || true
                fi

                echo "=== Running analyze.py ==="
                ANALYZE_ARGS=(
                  --results-dir "\$RESULTS_DIR"
                  --output-dir "\$REPORT_DIR"
                  --submission-name "$SUBMISSION_NAME"
                  --threshold "$UPLIFT_THRESHOLD"
                  --eval-engine "$EVAL_ENGINE"
                )
                [ -n "$COMMIT_SHA" ] && ANALYZE_ARGS+=(--commit-sha "$COMMIT_SHA")
                [ -n "$PIPELINE_RUN_ID" ] && ANALYZE_ARGS+=(--pipeline-run-id "$PIPELINE_RUN_ID")

                python scripts/analyze.py "\${ANALYZE_ARGS[@]}" 2>&1 || echo "WARNING: analyze.py failed"

                if [ -f "\$REPORT_DIR/report.json" ]; then
                  echo "=== REPORT_JSON_START ==="
                  cat "\$REPORT_DIR/report.json"
                  echo ""
                  echo "=== REPORT_JSON_END ==="

                  python3 -c "
                import json
                r = json.load(open('\$REPORT_DIR/report.json'))
                s = r.get('summary', {})
                t = s.get('treatment', {}).get('mean_reward')
                rec = s.get('recommendation', 'fail')
                n = s.get('treatment', {}).get('n_trials', 0)
                print(json.dumps({'mean_reward': t if t is not None else 0.0, 'recommendation': rec, 'n_trials': n}))
                "
                else
                  echo "WARNING: report.json not generated"
                  python3 -c "import json; print(json.dumps({'mean_reward': 0.0, 'recommendation': 'fail', 'n_trials': 0}))"
                fi

                echo "=== Remote Eval Pod Complete ==="
              env:
              - name: HOME
                value: /tmp
              - name: LLM_JUDGE_MODEL
                value: "openai/$(params.llm-model)"
              - name: LLM_BASE_URL
                value: "$(params.llm-api-base)"
              - name: LLM_API_BASE
                value: "$(params.llm-api-base)"
              - name: OPENAI_API_KEY
                value: "$(params.llm-api-key)"
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
        PODSPEC

          echo "Eval pod submitted. Waiting for completion..."

          TIMEOUT=$(params.eval-timeout)
          POLL_INTERVAL=15
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            PHASE=$(oc get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")
            case "$PHASE" in
              Succeeded)
                echo "Eval pod completed successfully (${ELAPSED}s)"
                break
                ;;
              Failed)
                echo "Eval pod failed (${ELAPSED}s)"
                oc logs $POD_NAME -n $NAMESPACE 2>&1 | tail -50
                break
                ;;
              *)
                printf "."
                sleep $POLL_INTERVAL
                ELAPSED=$((ELAPSED + POLL_INTERVAL))
                ;;
            esac
          done
          echo ""

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "TIMEOUT: Eval pod did not complete in ${TIMEOUT}s"
            oc logs $POD_NAME -n $NAMESPACE 2>&1 | tail -30
            oc delete pod $POD_NAME -n $NAMESPACE --ignore-not-found=true
            exit 1
          fi

          echo "=== Retrieving results ==="
          oc logs $POD_NAME -n $NAMESPACE 2>&1 | tee /tmp/eval-pod-logs.txt

          python3 - /tmp/eval-pod-logs.txt "$REPORT_DIR" "$(results.treatment-mean-reward.path)" "$(results.control-mean-reward.path)" "$(results.recommendation.path)" <<'EXTRACT'
        import json, re, sys

        logs_path, report_dir, treat_path, ctrl_path, rec_path = sys.argv[1:6]
        logs = open(logs_path).read()

        report_match = re.search(r'=== REPORT_JSON_START ===\n(.*?)\n=== REPORT_JSON_END ===', logs, re.DOTALL)
        if report_match:
            report_json = report_match.group(1).strip()
            try:
                report = json.loads(report_json)
                with open(f"{report_dir}/report.json", "w") as f:
                    json.dump(report, f, indent=2)
                print(f"Wrote report.json to {report_dir}/report.json")

                s = report.get("summary", {})
                t_reward = s.get("treatment", {}).get("mean_reward")
                recommendation = s.get("recommendation", "fail")
                print(f"Treatment mean reward: {t_reward}")
                print(f"Recommendation: {recommendation}")

                open(treat_path, "w").write(str(t_reward if t_reward is not None else 0.0))
                open(ctrl_path, "w").write("0.0")
                open(rec_path, "w").write(recommendation)
            except json.JSONDecodeError as e:
                print(f"ERROR: Failed to parse report.json: {e}")
        else:
            pattern = r'\{[^{}]*"mean_reward"[^{}]*\}'
            matches = re.findall(pattern, logs)
            if matches:
                summary = json.loads(matches[-1])
                open(treat_path, "w").write(str(summary.get("mean_reward", 0.0)))
                open(ctrl_path, "w").write("0.0")
                open(rec_path, "w").write(summary.get("recommendation", "fail"))
            else:
                print("WARNING: Could not extract results from pod logs")
        EXTRACT

          oc delete pod $POD_NAME -n $NAMESPACE --ignore-not-found=true
          echo "=== Remote evaluate phase complete ==="
          exit 0
        fi

        # ================================================================
        # LOCAL MODE: run evaluation directly in the task step
        # ================================================================
        echo "=== Local eval mode ==="

        cd "$PIPELINE_DIR"
        export PYTHONPATH="$PIPELINE_DIR"
        pip install --quiet --no-cache-dir pydantic scipy pyyaml 2>&1 | tail -3

        SUBMISSION_PATH="$(workspaces.source.path)/submissions/$SUBMISSION_DIR"

        # ---------- A2A Engine ----------
        if [ "$EVAL_ENGINE" = "a2a" ]; then
          if [ -z "$AGENT_ENDPOINT" ]; then
            echo "ERROR: agent-endpoint is required for a2a engine"
            exit 1
          fi

          echo "=== A2A Evaluation (local) ==="
          echo "Agent endpoint: $AGENT_ENDPOINT"

          N_ATTEMPTS=$(python3 -c "
        import yaml
        try:
            meta = yaml.safe_load(open('$SUBMISSION_PATH/metadata.yaml'))
            print(meta.get('experiment', {}).get('n_trials', 5))
        except:
            print(5)
        ")

          TASK_DIR=""
          if [ -f "$SUBMISSION_PATH/task.toml" ]; then
            TASK_DIR="$SUBMISSION_PATH"
          elif [ -d "$SUBMISSION_PATH/tasks" ]; then
            for subdir in "$SUBMISSION_PATH/tasks"/*/; do
              if [ -f "${subdir}task.toml" ]; then
                TASK_DIR="${subdir%/}"
                break
              fi
            done
          fi

          if [ -z "$TASK_DIR" ]; then
            echo "ERROR: No task.toml found in submission"
            exit 1
          fi

          echo "Task: $(basename $TASK_DIR) | Attempts: $N_ATTEMPTS"

          CONFIG_FILE="$RESULTS_DIR/a2a-config.yaml"
          LLM_API_BASE="$(params.llm-api-base)"
          LLM_MODEL="openai/$(params.llm-model)"

          python3 - "$CONFIG_FILE" "$TASK_DIR" "$RESULTS_DIR" "$N_ATTEMPTS" "$AGENT_ENDPOINT" "$(params.agent-timeout)" "$LLM_API_BASE" "$LLM_MODEL" <<'GENCFG'
        import sys, yaml
        config_file, task_dir, results_dir, n_attempts, endpoint, timeout, llm_api_base, llm_model = sys.argv[1:9]
        config = {
            "job_name": "a2a-eval",
            "jobs_dir": results_dir,
            "n_attempts": int(n_attempts),
            "agents": [{"import_path": "abevalflow.harbor_agents.a2a_adapter:A2AAgent", "kwargs": {"endpoint": endpoint, "timeout": int(timeout)}}],
            "tasks": [{"path": task_dir}],
            "environment": {"type": "local"},
            "verifier": {"env": {"LLM_JUDGE_MODEL": llm_model, "LLM_API_BASE": llm_api_base, "OPENAI_API_KEY": "sk-dummy"}}
        }
        with open(config_file, "w") as f:
            yaml.dump(config, f, default_flow_style=False)
        GENCFG

          python3 -c "from abevalflow.harbor_agents.a2a_adapter import A2AAgent; print('A2AAgent imported OK')"

          pip install --quiet --no-cache-dir harbor-bench 2>&1 | tail -3 || true
          HARBOR_EXIT=0
          harbor run -c "$CONFIG_FILE" -y 2>&1 || HARBOR_EXIT=$?
          echo "Harbor exit code: $HARBOR_EXIT"
          find "$RESULTS_DIR" -name "exception.txt" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || true

        # ---------- MCPChecker Engine ----------
        elif [ "$EVAL_ENGINE" = "mcpchecker" ]; then
          if [ -z "$MCP_URL" ]; then
            echo "ERROR: mcp-url is required for mcpchecker engine"
            exit 1
          fi

          echo "=== MCPChecker Evaluation (local) ==="
          echo "MCP URL: $MCP_URL"
          pip install --quiet --no-cache-dir mcpchecker 2>&1 | tail -3

          cd "$SUBMISSION_PATH"
          export MCP_URL
          envsubst < mcp-config.yaml > mcp-config-resolved.yaml 2>/dev/null || cp mcp-config.yaml mcp-config-resolved.yaml

          if [ -n "$(params.llm-api-base)" ]; then
            export OPENAI_BASE_URL="$(params.llm-api-base)"
          fi

          mcpchecker check eval.yaml --mcp-config-file mcp-config-resolved.yaml -o json > "$RESULTS_DIR/mcpchecker-out.json" 2>&1 || true

          python3 - "$RESULTS_DIR/mcpchecker-out.json" "$SUBMISSION_NAME" "$REPORT_DIR" "$PIPELINE_RUN_ID" <<'AGGREGATE'
        import json, sys
        from pathlib import Path
        output_file, sub_name, report_dir, run_id = sys.argv[1:5]
        try:
            data = json.loads(Path(output_file).read_text())
            total = data.get("total_checks", 0)
            passed = data.get("passed_checks", 0)
            score = passed / total if total > 0 else 0.0
            rec = "pass" if score >= 0.7 else "fail"
            report = {"summary": {"submission_name": sub_name, "recommendation": rec, "treatment": {"mean_reward": score, "n_trials": total}, "control": {"mean_reward": 0.0}}, "pipeline_run_id": run_id}
            Path(report_dir).mkdir(parents=True, exist_ok=True)
            (Path(report_dir) / "report.json").write_text(json.dumps(report, indent=2))
            print(f"MCPChecker score: {score:.4f}, recommendation: {rec}")
        except Exception as e:
            print(f"WARNING: MCPChecker aggregation failed: {e}")
        AGGREGATE

          cd "$PIPELINE_DIR"

        # ---------- ASE Engine ----------
        elif [ "$EVAL_ENGINE" = "ase" ]; then
          echo "=== ASE Evaluation (local) ==="

          ITERATIONS="$(params.ase-iterations)"
          LLM_MODEL="$(params.llm-model)"
          BASE_URL="$(params.llm-api-base)"
          JUDGE_MODEL="$(params.ase-judge-model)"
          CONCURRENCY="$(params.ase-concurrency)"

          if [ -f "$SUBMISSION_PATH/metadata.yaml" ]; then
            OVERRIDES=$(python3 -c "import yaml,sys;m=yaml.safe_load(open(sys.argv[1]))or{};e=m.get('experiment')or{};l=m.get('llm')or{};e.get('n_trials')and print('ITERATIONS='+str(e['n_trials']));l.get('model')and print('LLM_MODEL='+str(l['model']));l.get('api_base')and print('BASE_URL='+str(l['api_base']));l.get('judge_model')and print('JUDGE_MODEL='+str(l['judge_model']));e.get('concurrency')and print('CONCURRENCY='+str(e['concurrency']))" "$SUBMISSION_PATH/metadata.yaml" 2>/dev/null || true)
            eval "$OVERRIDES"
          fi

          ITERATIONS="${ITERATIONS:-5}"
          LLM_MODEL="${LLM_MODEL:-claude-sonnet}"
          BASE_URL="${BASE_URL:-}"
          JUDGE_MODEL="${JUDGE_MODEL:-$LLM_MODEL}"
          CONCURRENCY="${CONCURRENCY:-1}"
          [[ -n "$BASE_URL" && "$BASE_URL" != */v1 ]] && BASE_URL="${BASE_URL}/v1"

          echo "  Iterations: $ITERATIONS | Model: $LLM_MODEL | Judge: $JUDGE_MODEL"

          SKILL_DIR=""
          if [ -f "$SUBMISSION_PATH/skills/SKILL.md" ]; then
            SKILL_DIR="$SUBMISSION_PATH/skills"
          else
            for dir in "$SUBMISSION_PATH"/skills/*/; do
              if [ -f "${dir}SKILL.md" ]; then
                SKILL_DIR="$dir"
                break
              fi
            done
          fi

          if [ -z "$SKILL_DIR" ]; then
            echo "ERROR: No SKILL.md found in submission"
            exit 1
          fi

          if [ ! -f "$SKILL_DIR/evals/evals.json" ] && [ -f "$SUBMISSION_PATH/evals/evals.json" ]; then
            ln -sf "$SUBMISSION_PATH/evals" "$SKILL_DIR/evals"
          fi

          npm install --global agent-skills-eval 2>&1 | tail -3

          for i in $(seq 1 "$ITERATIONS"); do
            echo "--- ASE Iteration $i/$ITERATIONS ---"
            ASE_ARGS=("$SKILL_DIR" --baseline --layout iteration --report)
            [ -n "$BASE_URL" ] && ASE_ARGS+=(--base-url "$BASE_URL")
            ASE_ARGS+=(--target "$LLM_MODEL" --judge "$JUDGE_MODEL")
            ASE_ARGS+=(--concurrency "$CONCURRENCY" --workspace "$RESULTS_DIR/iteration-$i")
            ASE_ARGS+=(--api-key-env OPENAI_API_KEY)
            agent-skills-eval "${ASE_ARGS[@]}" || true
          done

        # ---------- Harbor Engine ----------
        elif [ "$EVAL_ENGINE" = "harbor" ]; then
          echo "=== Harbor Evaluation (local) ==="
          echo "NOTE: Harbor scaffold+build requires a container registry."
          echo "For full Harbor evaluation, use the standalone ABEvalFlow pipeline."
          echo "Attempting direct eval via task files..."

          pip install --quiet --no-cache-dir harbor-bench 2>&1 | tail -3 || true

          TASK_DIR=""
          if [ -f "$SUBMISSION_PATH/task.toml" ]; then
            TASK_DIR="$SUBMISSION_PATH"
          elif [ -d "$SUBMISSION_PATH/tasks" ]; then
            for subdir in "$SUBMISSION_PATH/tasks"/*/; do
              if [ -f "${subdir}task.toml" ]; then
                TASK_DIR="${subdir%/}"
                break
              fi
            done
          fi

          if [ -n "$TASK_DIR" ]; then
            echo "Running Harbor with local environment for: $(basename $TASK_DIR)"
            N_ATTEMPTS=$(python3 -c "import yaml;m=yaml.safe_load(open('$SUBMISSION_PATH/metadata.yaml'));print(m.get('experiment',{}).get('n_trials',5))" 2>/dev/null || echo "5")

            python3 - "$RESULTS_DIR" "$TASK_DIR" "$N_ATTEMPTS" "$(params.llm-api-base)" "openai/$(params.llm-model)" <<'HARBORCFG'
        import sys, yaml
        results_dir, task_dir, n_attempts, llm_api_base, llm_model = sys.argv[1:6]
        config = {
            "job_name": "harbor-eval",
            "jobs_dir": results_dir,
            "n_attempts": int(n_attempts),
            "tasks": [{"path": task_dir}],
            "environment": {"type": "local"},
            "verifier": {"env": {"LLM_JUDGE_MODEL": llm_model, "LLM_API_BASE": llm_api_base, "OPENAI_API_KEY": "sk-dummy"}}
        }
        with open(results_dir + "/config.yaml", "w") as f:
            yaml.dump(config, f, default_flow_style=False)
        HARBORCFG
            harbor run -c "$RESULTS_DIR/config.yaml" -y 2>&1 || true
          else
            echo "WARNING: No task.toml found, skipping Harbor eval"
          fi

        else
          echo "ERROR: Unsupported eval engine: $EVAL_ENGINE"
          exit 1
        fi

        # ---- Run analyze.py (for local mode) ----
        echo "=== Running analyze.py ==="
        ANALYZE_ARGS=(
          --results-dir "$RESULTS_DIR"
          --output-dir "$REPORT_DIR"
          --submission-name "$SUBMISSION_NAME"
          --threshold "$UPLIFT_THRESHOLD"
          --eval-engine "$EVAL_ENGINE"
        )
        [ -n "$COMMIT_SHA" ] && ANALYZE_ARGS+=(--commit-sha "$COMMIT_SHA")
        [ -n "$PIPELINE_RUN_ID" ] && ANALYZE_ARGS+=(--pipeline-run-id "$PIPELINE_RUN_ID")

        python scripts/analyze.py "${ANALYZE_ARGS[@]}" 2>&1 || echo "WARNING: analyze.py failed"

        # ---- Extract results for Tekton ----
        if [ -f "$REPORT_DIR/report.json" ]; then
          python3 -c "
        import json, sys
        r = json.load(open(sys.argv[1]))
        s = r.get('summary', {})
        t = s.get('treatment', {}).get('mean_reward')
        rec = s.get('recommendation', 'fail')
        open(sys.argv[2], 'w').write(str(t if t is not None else 0.0))
        open(sys.argv[3], 'w').write('0.0')
        open(sys.argv[4], 'w').write(rec)
        print(f'Recommendation: {rec}, Mean reward: {t}')
        " "$REPORT_DIR/report.json" \
          "$(results.treatment-mean-reward.path)" \
          "$(results.control-mean-reward.path)" \
          "$(results.recommendation.path)"
        else
          echo "WARNING: report.json not generated"
        fi

        echo "=== Evaluate phase complete ==="
